.al{background:var(--g2);border-left:4px solid var(--g);padding:10px;border-radius:6px}.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{border-bottom:1px solid var(--b);padding:6px;text-align:left;vertical-align:top;font-size:14px}

footer{background:var(--hd);color:#fff;text-align:center;padding:18px;margin-top:24px;font-size:14px}</style></head><body><header><div class="br" role="link" tabindex="0" onclick="go(S.u?'dash':'login')" onkeydown="if(event.key==='Enter')go(S.u?'dash':'login')"><span class="lg"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><path fill="#214E3D" d="M30 24C20 24 17 14 21 6c9 2 13 10 9 18z"/><path fill="#214E3D" d="M36 26c0-11 6-19 17-22 2 11-5 20-17 22z"/><circle cx="40" cy="33" r="9" fill="#E97852"/><path fill="#214E3D" d="M6 34h52c0 14-11 24-26 24S6 48 6 34z"/><path d="M20 46c9 2 18-1 26-10" stroke="#BCE6C5" stroke-width="3" fill="none" stroke-linecap="round"/></svg></span><span><b class="bn">ResQ<span>Bite</span></b><small>RESCUE FOOD. RESTORE HOPE.</small></span></div><nav id="nav"></nav></header><main id="app"></main><footer><b>ResQ<span style="color:#BCE6C5">Bite</span></b> · Rescue food. Restore hope.<div id="cs" style="font-size:12px;margin-top:6px;opacity:.85"></div></footer>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),g=i=>document.getElementById(i).value.trim();
const C={'Banjara Hills':[17.41,78.44],Gachibowli:[17.44,78.35],Secunderabad:[17.44,78.5],Kukatpally:[17.49,78.4],Charminar:[17.36,78.47],Madhapur:[17.45,78.39],Dilsukhnagar:[17.37,78.52]},CT=Object.keys(C);
const km=(a,b)=>{const r=x=>x*Math.PI/180,p=C[a],q=C[b];return 12742*Math.asin(Math.sqrt(Math.sin(r(q[0]-p[0])/2)**2+Math.cos(r(p[0]))*Math.cos(r(q[0]))*Math.sin(r(q[1]-p[1])/2)**2))};
const CATS=['cooked','dairy','meat','bakery','produce','packaged'],QS=['Name of your first school?','Name of your first pet?','City where you were born?'],SG=['sour/off smell','mould','slime','discolouration','bloated packaging'],act=['requested','scheduled','picked'];
let D,S={u:null,v:'login',m:'',f:{}};const now=()=>Date.now(),id=()=>{const t=Date.now()*1000+Math.floor(Math.random()*1000);return LI=t>LI?t:LI+1},U=()=>D.users.find(u=>u.id==S.u);
/* ================= CLOUD DATABASE (Supabase) =================
   1. Create a free project at https://supabase.com
   2. Run supabase_setup.sql in the Supabase SQL Editor
   3. Paste your Project URL and anon/public key below.
   Leave both empty to keep using browser-only storage (no errors). */
const CFG={url:'',key:''};
const CLOUD=!!(CFG.url.trim()&&CFG.key.trim()),TB={users:'rb_users',lists:'rb_lists',reqs:'rb_reqs',notes:'rb_notes',inc:'rb_inc'};
let SY={},PQ=0,PT=0,PU=0,DV=0,OFF=0,LI=0;
const cst=m=>{const x=document.getElementById('cs');if(x)x.textContent=m};
const api=async(p,o={})=>{const h={apikey:CFG.key.trim(),'Content-Type':'application/json'};if(CFG.key.trim().startsWith('eyJ'))h.Authorization='Bearer '+CFG.key.trim();
const r=await fetch(CFG.url.trim().replace(/\/+$/,'')+'/rest/v1/'+p,{...o,headers:{...h,...(o.headers||{})}});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,150));return r};
const snap=o=>JSON.stringify([o.users,o.lists,o.reqs,o.notes,o.inc]);
async function pull(){if(!CLOUD||OFF)return null;if(PQ)return false;try{const n={n:0,users:[],lists:[],reqs:[],notes:[],inc:[]},sy={};
for(const k in TB){const r=await(await api(TB[k]+'?select=data&order=id.asc&limit=10000')).json();n[k]=r.map(x=>x.data).filter(Boolean);sy[TB[k]]=new Map(n[k].map(x=>[x.id,JSON.stringify(x)]))}
if(PQ)return false;const ch=!D||snap(n)!==snap(D);SY=sy;D=n;cst('☁ Cloud database connected');return ch}catch(x){console.warn('ResQBite cloud pull failed:',x.message);cst('⚠ Cloud database unreachable');return null}}
const queue=()=>{if(!CLOUD||OFF)return;PQ=1;DV++;clearTimeout(PT);PT=setTimeout(push,400)};
async function push(){if(PU){PT=setTimeout(push,300);return}PU=1;const v=DV;try{for(const k in TB){const t=TB[k],m=SY[t]||(SY[t]=new Map()),ch=[];
D[k].forEach(x=>{const s=JSON.stringify(x);if(m.get(x.id)!==s)ch.push([x,s])});
for(let i=0;i<ch.length;i+=200){const part=ch.slice(i,i+200);await api(t+'?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(part.map(([x])=>({id:x.id,data:x})))});part.forEach(([x,s])=>m.set(x.id,s))}}
PU=0;if(v==DV){PQ=0;cst('☁ Cloud database connected · saved')}}catch(x){PU=0;console.warn('ResQBite cloud save failed:',x.message);cst('⚠ Saving to cloud failed, retrying…');PT=setTimeout(push,5000)}}
const rf=async()=>{if(!CLOUD||OFF||document.hidden)return;if(await pull()){const a=document.activeElement;if(!a||!/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))R()}};
const save=()=>{if(S.t)return;try{localStorage.setItem('rb1',JSON.stringify(D))}catch(x){}queue()};
const hash=async(p,s)=>{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:100000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const note=(to,m)=>D.notes.push({id:id(),to,m,t:now(),r:0}),admins=m=>D.users.filter(x=>x.role=='admin').forEach(a=>note(a.id,m));
const mkUser=async o=>{const salt=Math.random().toString(36).slice(2),u={id:id(),name:o.name,email:o.email.toLowerCase(),role:o.role,org:o.org,city:o.city,reg:o.reg||'',pref:'',salt,hash:await hash(o.pw,salt),q:o.q,ans:await hash(o.ans.toLowerCase(),salt),ver:o.role=='ngo'?o.ver||0:1,demo:o.demo||0};D.users.push(u);return u};
const nm=i=>(D.users.find(u=>u.id==i)||{}).org||'?',L=i=>D.lists.find(l=>l.id==i)||{},fd=t=>t?new Date(t).toLocaleString('en',{dateStyle:'medium',timeStyle:'short'}):'-';
const avail=l=>l.qty-D.reqs.filter(r=>r.l==l.id&&(act.includes(r.st)||['delivered','spoiled'].includes(r.st))).reduce((a,r)=>a+r.qty,0);
function screen(f){const R=[],F=[],h=(now()-f.prep)/36e5,pf=['cooked','dairy','meat'].includes(f.cat);
if(f.exp<=now())R.push('Use-by deadline has passed');if(f.prep>now()+6e4)R.push('Preparation time is in the future');
if(f.signs.length)R.push('Spoilage signs reported: '+f.signs.join(', '));if(f.contam)R.push('Contamination risk reported');
if(pf){if(f.store=='room'){if(h>4)R.push(`Perishable food at room temperature ${h.toFixed(1)}h (limit 4h)`);else if(h>2)F.push('Perishable food at room temperature over 2h')}
if(f.store=='fridge'){if(f.temp>8)R.push(`Fridge temperature ${f.temp}°C is above 8°C`);else if(f.temp>5)F.push('Fridge temperature above 5°C')}
if(f.store=='hot'){if(f.temp<50)R.push('Hot-held food below 50°C');else if(f.temp<60)F.push('Hot-held food below 60°C')}
if(f.store=='frozen'&&f.temp>-15)F.push('Frozen food warmer than -15°C');if(h>24&&f.store!='frozen')F.push('Prepared over 24h ago')}
if(f.pkg)F.push('Damaged packaging');if(!R.length&&f.exp-now()<36e5)F.push('Expires within 1 hour: too short for pickup');
return{res:R.length?'rejected':F.length?'flagged':'passed',why:[...R,...F]}}
const mkList=(u,f)=>{const s=screen(f),l={...f,id:id(),donor:u.id,t:now(),scr:s,status:s.res=='passed'?'available':s.res=='flagged'?'review':'rejected'};D.lists.push(l);if(l.status=='review')admins(`Flagged listing "${l.name}" needs safety review`);save();return l};
const fresh=l=>{const t=now(),s=screen({...l,signs:[],contam:0});if(l.exp<=t)return['bad','Expired: DO NOT EAT. Discard.'];if(s.res=='rejected')return['bad','Time/temperature limit exceeded, likely unsafe: do not eat. '+s.why.join('; ')];if(l.exp-t<72e5||s.res=='flagged')return['soon','Serve immediately. '+s.why.join('; ')];return['fit','Within safe time limits per recorded conditions. Still check sight and smell.']};
const fb=l=>{const f=fresh(l);return`<span class="bd ${f[0]=='fit'?'':f[0]=='soon'?'w':'x'}">${f[0]=='fit'?'Fit to eat':f[0]=='soon'?'Use immediately':'Spoiled / unfit'}</span> <span class="m">${e(f[1])}</span>`};
const Req=(u,lid,q)=>{const l=D.lists.find(x=>x.id==lid);q=+q;if(u.role!='ngo'||!u.ver)return'Only verified NGOs can request food';if(!l||l.status!='available')return'Listing is not available';if(l.exp<=now())return'Listing has expired';if(!(q>0))return'Enter a valid quantity';
if(D.reqs.some(r=>r.l==l.id&&r.ngo==u.id&&act.includes(r.st)))return'You already have an active request for this listing';if(q>avail(l))return`Only ${avail(l)} kg left`;
D.reqs.push({id:id(),l:l.id,ngo:u.id,qty:q,st:'requested',t:now()});note(l.donor,`${u.org} requested ${q} kg of ${l.name}`);save();return''};
const mine=(u,rid,st)=>{const r=D.reqs.find(x=>x.id==rid),l=r&&L(r.l);return r&&r.st==st&&(u.role=='donor'?l.donor==u.id:r.ngo==u.id)?[r,l]:null};
const Appr=(u,rid,slot)=>{const m=u.role=='donor'&&mine(u,rid,'requested');if(!m)return'Not allowed';const[r,l]=m;if(!(slot>now()))return'Pick a future pickup time';if(slot>=l.exp)return'Pickup must be before the use-by deadline';
r.st='scheduled';r.slot=slot;r.code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);note(r.ngo,`Approved: ${l.name}. Pickup ${fd(slot)}, code ${r.code}`);save();return''};
const Rej=(u,rid)=>{const m=u.role=='donor'&&mine(u,rid,'requested');if(!m)return'Not allowed';m[0].st='rejected';note(m[0].ngo,`Request for ${m[1].name} was declined`);save();return''};
const Pick=(u,rid,c)=>{const m=u.role=='donor'&&mine(u,rid,'scheduled');if(!m)return'Not allowed';const[r,l]=m;if(l.exp<=now()){r.st='cancelled';save();return'Food has expired: pickup blocked'}if(c!=r.code)return'Wrong pickup code';r.st='picked';r.pt=now();note(r.ngo,`Pickup verified for ${l.name}`);save();return''};
const Del=(u,rid,b,c)=>{const m=u.role=='ngo'&&mine(u,rid,'picked');if(!m)return'Not allowed';const[r,l]=m;if(c=='spoiled'){r.st='spoiled';r.dt=now();r.ben=0;D.inc.push({id:id(),r:rid,by:u.id,txt:'Food found spoiled/unfit on inspection: '+l.name,open:1,t:now()});admins(`Spoiled food reported: ${l.name}`);note(l.donor,`${l.name} was found spoiled/unfit on inspection and discarded`);if(avail(l)==0&&!D.reqs.some(x=>x.l==l.id&&act.includes(x.st)))l.status='completed';save();return''}r.st='delivered';r.dt=now();r.ben=Math.max(0,+b||0);if(avail(l)==0&&!D.reqs.some(x=>x.l==l.id&&act.includes(x.st)))l.status='completed';note(l.donor,`${l.name} delivered (${r.qty} kg)`);save();return''};
const Can=(u,rid)=>{const r=D.reqs.find(x=>x.id==rid);if(!r||!['requested','scheduled'].includes(r.st)||u.role=='admin')return'Not allowed';const l=L(r.l);if(u.role=='ngo'?r.ngo!=u.id:l.donor!=u.id)return'Not allowed';r.st='cancelled';note(u.role=='ngo'?l.donor:r.ngo,`Request for ${l.name} was cancelled`);save();return''};
function sweep(){let c=0;D.lists.forEach(l=>{if(l.status=='available'&&l.exp<=now()){l.status='expired';c=1;D.reqs.filter(r=>r.l==l.id&&['requested','scheduled'].includes(r.st)).forEach(r=>{r.st='cancelled';note(r.ngo,`Request for ${l.name} cancelled: expired`)})}});if(c)save()}
const flash=m=>{S.m=m;R()},go=v=>{S.v=v;S.m='';R();scrollTo(0,0);rf()};
const inp=(i,l,t='text',x='',v='')=>`<label for="${i}">${l}</label><input id="${i}" type="${t}" value="${e(v)}" ${x}>`,sel=(i,l,o,v)=>`<label for="${i}">${l}</label><select id="${i}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${e(a)}"${a==v?' selected':''}>${e(b)}</option>`}).join('')}</select>`;
const st=()=>{const d=D.reqs.filter(r=>r.st=='delivered'),all=D.reqs.length;return{kg:d.reduce((a,r)=>a+r.qty,0),n:d.length,ppl:d.reduce((a,r)=>a+(r.ben||0),0),rate:all?Math.round(d.length/all*100):0,all,d}};
const trend=rs=>{const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const a=+d;o.push([d.toLocaleDateString('en',{weekday:'short'}),rs.filter(r=>r.st=='delivered'&&r.dt>=a&&r.dt<a+864e5).reduce((s,r)=>s+r.qty,0)])}return o};
const bars=(d,t)=>{const m=Math.max(1,...d.map(x=>x[1]));return`<div class="card"><h3>${t}</h3><svg viewBox="0 0 ${d.length*50} 120" role="img" aria-label="${t}" style="width:100%;max-width:440px">${d.map((x,i)=>{const h=x[1]/m*70;return`<rect x="${i*50+8}" y="${95-h}" width="34" height="${h}" rx="3" fill="var(--g)"/><text x="${i*50+25}" y="${90-h}" text-anchor="middle" font-size="10" fill="var(--t)">${x[1]}</text><text x="${i*50+25}" y="111" text-anchor="middle" font-size="9" fill="var(--m)">${e(x[0])}</text>`}).join('')}</svg></div>`};
const cards=a=>`<div class="grid">${a.map(x=>`<div class="card stat"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>`;
const bd=s=>`<span class="bd ${['rejected','expired','cancelled','spoiled'].includes(s)?'x':['review','requested'].includes(s)?'w':''}">${s=='review'?'admin review':s}</span>`;
const home=()=>{const s=st();return`<section class="hero"><h1>Good food deserves a second chance.</h1><p>ResQBite connects restaurants, supermarkets, hostels, canteens and event organisers with verified NGOs, with food-safety screening built in.</p><button class="cta" onclick="A.rg('donor')">Donate Food</button> <button class="o" onclick="A.rg('ngo')">Find Food</button></section>${cards([[s.kg,'kg redistributed'],[s.n,'completed deliveries'],[s.ppl,'people served (reported by NGOs)'],['≈'+Math.round(s.kg*2.5),'meals (ESTIMATE: 2.5 meals/kg)']])}<p class="m">Figures are computed from platform records, which currently include labelled demo data.</p><h2>How it works</h2><div class="grid">${[['1 · Donate','Donors list surplus food with storage and safety details.'],['2 · Connect','Verified NGOs discover, filter and request food.'],['3 · Collect','Donors approve requests and schedule pickup with a unique code.'],['4 · Deliver &amp; Track','Recipients confirm delivery and impact statistics update.']].map(x=>`<div class="card"><h3>${x[0]}</h3>${x[1]}</div>`).join('')}</div>`};
const login=()=>`<div style="text-align:center;padding:8px 0 16px"><svg viewBox="0 0 64 64" width="120" height="120" role="img" aria-label="ResQBite logo"><path fill="var(--g)" d="M30 24C20 24 17 14 21 6c9 2 13 10 9 18z"/><path fill="var(--g)" d="M36 26c0-11 6-19 17-22 2 11-5 20-17 22z"/><circle cx="40" cy="33" r="9" fill="#E97852"/><path fill="var(--g)" d="M6 34h52c0 14-11 24-26 24S6 48 6 34z"/><path d="M20 46c9 2 18-1 26-10" stroke="var(--bg)" stroke-width="3" fill="none" stroke-linecap="round"/></svg><div style="font-size:44px;font-weight:800;line-height:1.1"><span style="color:var(--g)">ResQ</span><span style="color:#8DB88B">Bite</span></div><div style="letter-spacing:.2em;font-size:12px;color:var(--g)">RESCUE FOOD. RESTORE HOPE.</div></div><section class="hero"><h1>Good food deserves a second chance.</h1><p>Connecting surplus food with organizations that can get it to people who need it.</p><button class="cta" onclick="A.rg('donor')">Donate Food</button> <button class="o" onclick="A.rg('ngo')">Find Food</button></section><form class="f card" onsubmit="return false"><h2>Login</h2>${inp('em','Email','email','autocomplete=username')}${inp('pw','Password','password','autocomplete=current-password')}<p><button onclick="A.login()">Login</button> <button class="o" onclick="go('rec')">Forgot password?</button></p><hr><p><b>Don't have an account? Register as:</b></p><button class="o" onclick="A.rg('donor')">Donor</button> <button class="o" onclick="A.rg('ngo')">NGO</button><p class="m"><b>Demo accounts</b> (sample data): admin@resqbite.demo / Admin@123 · donor@resqbite.demo / Demo@1234 · ngo@resqbite.demo / Demo@1234</p></form><h2>Make every meal matter.</h2><div class="grid"><div class="card"><div>📦</div><h3>Food donations</h3>List surplus food for collection.</div><div class="card" style="background:var(--g2)"><div>🤝</div><h3>Community impact</h3>Connect donors and NGOs.</div></div>`;
